    low_periods:
      - February
      - September
    category_dynamics:
      - Deodorant demand peaks with UK summer temperatures; body wash and hand wash are flatter and slightly winter-weighted, so the range expansion damps overall amplitude from 2026.
      - Black Friday is the single sharpest acquisition window for D2C personal care, and it recruits a discount-led cohort with weaker downstream repeat behaviour.
      - Refill replenishment is contractual on a 3-monthly cadence, so a large share of monthly volume is insensitive to season.

source_systems:
  confirmed:
    - name: Shopify
      confirmation_source: technology_profiler
      evidence_links:
        - https://www.getfussy.com/products.json
        - https://www.getfussy.com/ (cdn.shopify.com, shop.app/checkouts, web-pixels-manager, store handle we-are-fussy.myshopify.com)
      evidence_notes: Live products.json returns 184 products; rendered homepage carries cdn.shopify.com asset and extension URLs, the Shopify checkout domain and the store handle we-are-fussy.myshopify.com. Profiler pass 2026-08-06.
      domain: commerce
      export_shape: standard connector schema
      platform_resources:
        - products
        - orders
        - customers
        - order_items
      join_keys:
        - product_id
        - variant_id
        - order_id
        - customer_id
      schema_basis: official documentation
      schema_notes: Subscription context carried on line items via selling-plan fields; order-level subscription status comes from the Recharge extracts, not a Shopify boolean.
      known_limitations:
        - Retail (Tesco, Sainsbury's, Waitrose, Boots) sell-through never reaches Shopify and is out of scope for this dataset.
    - name: Recharge
      confirmation_source: technology_profiler
      evidence_links:
        - https://www.getfussy.com/ (checkout.rechargeapps.com present in the storefront checkout-domain allowlist)
        - https://www.getfussy.com/pages/subscribe
      evidence_notes: checkout.rechargeapps.com appears in the rendered storefront's checkout-domain configuration, which is how a Recharge-powered subscription checkout is wired. Corroborated by the Subscribe & Save mechanics on /pages/subscribe. Profiler pass 2026-08-06.
      domain: subscriptions
      export_shape: standard connector schema
      platform_resources:
        - subscriptions
        - charges
      join_keys:
        - shopify_customer_id
        - shopify_order_id
        - subscription_id
        - charge_id
      schema_basis: official documentation
      schema_notes: NEW standard source for this repo — see references/standard-source-schemas/recharge.md. Charges reference the Shopify order they created, which is what makes the "renewals bypass GA4" gap provable.
      known_limitations:
        - Cancellation/churn state is recorded when the customer acts in the portal, which can lag the last billed charge (modelled as a data issue).
    - name: Klaviyo
      confirmation_source: technology_profiler
      evidence_links:
        - https://www.getfussy.com/ (static.klaviyo.com/onsite script)
      evidence_notes: static.klaviyo.com/onsite is loaded directly in the rendered homepage — unambiguous first-party detection. No competing ESP (Bloomreach, Customer.io, Attentive, Postscript) detected. Profiler pass 2026-08-06.
      domain: lifecycle
      export_shape: events_api
      platform_resources:
        - email_events
        - sms_events
      join_keys:
        - email
        - profile_id
      schema_basis: official documentation
      schema_notes: Single event-per-row stream (klaviyo_events.csv); metric_name names the action. Trimmed to 12 historic months (from 2025-09-01).
      known_limitations:
        - Placed Order events carry no reliable Shopify order id, so the link to commerce is soft (email + $value + timestamp), not a hard FK.
    - name: GA4
      confirmation_source: technology_profiler
      evidence_links:
        - https://www.getfussy.com/ (measurement id G-EENVJ92ML3, container GTM-5D4WR9P, Littledata Shopify tracker extension)
      evidence_notes: GA4 measurement id, GTM container and the Littledata server-side Shopify tracker (littledata-shopify-tracker-142 app extension) all present in the rendered homepage. Profiler pass 2026-08-06.
      domain: web_analytics
      export_shape: reporting_api
      platform_resources:
        - purchase_events
        - purchase_items
      join_keys:
        - transactionId
      schema_basis: official documentation
      schema_notes: Reporting/Data API schema, not the BigQuery export. Covers web checkouts only — Recharge renewals are created server-side and do not fire a web purchase event.
      known_limitations:
        - purchaseRevenue is reported shipping- and tax-inclusive, which does not match the Shopify AOV convention (modelled as a data issue).
    - name: Google Ads
      confirmation_source: technology_profiler
      evidence_links:
        - https://www.getfussy.com/ (conversion tag AW-621884946; Littledata colibrius-aw.js Google Ads tracker extension)
      evidence_notes: Google Ads conversion tag id and a dedicated Littledata Google Ads tracker asset are both present in the rendered homepage. Profiler pass 2026-08-06.
      domain: paid_media
      export_shape: googleads_api
      platform_resources:
        - campaign_performance
      join_keys:
        - campaign_id
      schema_basis: official documentation
      schema_notes: Daily campaign-level GAQL performance across SEARCH / SHOPPING / PERFORMANCE_MAX / DEMAND_GEN. Full 24-month window.
      known_limitations:
        - Aggregate daily fact; no join to individual commerce orders.
    - name: Gorgias
      confirmation_source: technology_profiler
      evidence_links:
        - https://www.getfussy.com/ (config.gorgias.chat bundle loader, shop=we-are-fussy.myshopify.com)
        - https://getfussy.gorgias.help/en-US
      evidence_notes: Gorgias chat bundle loader is embedded in the rendered homepage and the brand's public help centre is hosted on getfussy.gorgias.help. No Zendesk/Intercom signature found. Profiler pass 2026-08-06.
      domain: support
      export_shape: standard connector schema
      platform_resources:
        - tickets
      join_keys:
        - customer_email
        - shopify_order_id
      schema_basis: official documentation
      schema_notes: NEW standard source for this repo — see references/standard-source-schemas/gorgias.md.
      known_limitations:
        - Order linkage is agent-applied and therefore incomplete (modelled as a data issue).
  open_questions:
    - Meta Ads — no Meta pixel found in the rendered homepage; it may be configured server-side inside Shopify's web-pixels sandbox. User directed that it be left out of generation and recorded here. If the client confirms a Meta account, add meta_ads_insights.csv and meta_ad_creatives.csv in a later pass.
    - Market scope — user directed UK-only, but the store runs Shopify Markets across ~30 countries (GBP/EUR/USD/AUD/CAD and more) and continental Europe is publicly reported at ~15% of group revenue. The generated dataset will therefore understate the real international mix. Revisit if the pitch needs the multi-currency story.
    - Also detected on-site but not modelled as source systems: Littledata (tracking middleware, not a reportable source), Trustpilot (reviews), Hotjar and Microsoft Clarity (behavioural analytics), CookieYes (consent), AfterSell and UpCart (checkout/cart apps), Zapiet (delivery scheduling). Confirm with the client whether any are wanted before a later phase.
    - Retail EPOS / sell-through (Tesco, Sainsbury's, Waitrose, Boots, Superdrug, Holland & Barrett) is explicitly out of scope; the group's >£30m run-rate cannot be reconciled from this dataset alone.

standardization:
  canonical_tables:
    - users
    - orders
  mapping_notes:
    - No stage or analytics outputs until raw source outputs are generated, validated, and reviewed.
    - Recharge subscriptions/charges clean into the shared subscriptions / subscription_orders roles alongside the existing OrderGroove specs.
    - Gorgias tickets clean into the shared support_tickets role alongside the existing Zendesk spec.
    - Google Ads cleans into the shared ad_performance metric vocabulary (spend derived from cost_micros).

data_issues:
  selected:
    - issue: Email casing or whitespace drift
      severity: low
      expected_prevalence: 1.5-3% of Shopify customer and Klaviyo profile email records
      check: email_casing_or_whitespace_drift
      expected_prevalence_range: [0.015, 0.030]
      affected_systems:
        - Shopify
        - Klaviyo
        - Gorgias
      visibility: subtle
      rationale: Email is the join key between commerce, the ESP and the helpdesk, so casing/whitespace drift is the single most common identity-normalisation problem for a Shopify + Klaviyo + Gorgias stack.
      notes: Lower/trim normalisation reconciles it in staging.
    - issue: Near-duplicate orders from subscription billing retries
      severity: low
      expected_prevalence: 0.2-0.6% of orders carry a duplicate-looking order name; underlying id stays unique
      check: near_duplicate_orders
      expected_prevalence_range: [0.002, 0.006]
      affected_systems:
        - Shopify
        - Recharge
      visibility: subtle
      rationale: Recharge retries failed charges and replays webhooks, which is exactly how duplicate-looking order names appear in a subscription-led Shopify store. Higher prevalence than a one-off-purchase brand because ~55% of orders are recurring charges.
      notes: Duplicate display name only — the Shopify order id remains unique, so the PK check must still pass.
    - issue: Channel tracking breaks around consent and tag changes
      severity: medium
      expected_prevalence: Baseline ~8% Unassigned; two windows at ~20-22% for 7-8 days (2025-11-24, 2026-04-13)
      check: channel_tracking_break
      expected_prevalence_range: [0.18, 0.25]
      affected_systems:
        - GA4
      visibility: obvious
      rationale: CookieYes consent management, GTM and the Littledata tracker are all live; a Cyber Week tagging change and a later consent-mode reconfiguration are the most believable causes of attribution gaps.
      notes: One structural unattributed floor only — do not stack a second random (not set) path on top. See references/channel-mix-benchmarks.md.
    - issue: Subscription renewals bypass GA4 entirely
      severity: high
      expected_prevalence: realized 48.8% of orders absent from GA4 — 92.0% of Recharge renewals (renewals are 49.1% of orders) plus 7.2% web tag/consent loss on the remaining web checkouts; GA4 sees 55.2% of Shopify revenue
      affected_systems:
        - GA4
        - Recharge
        - Shopify
      visibility: subtle
      rationale: >
        Recharge recurring charges are created server-side with no browser session, so they never
        fire a GA4 web purchase event. First orders and one-time repeats are genuine web checkouts
        (~93% captured). This is the headline pitch insight for Fussy — GA4 alone sees roughly
        two-fifths of revenue, badly understates retention and LTV, and would over-credit paid
        acquisition if renewals were attributed to a channel.
      notes: >
        MANUAL. Signature — orders present in recharge_subscription_orders.shopify_order_id but
        absent from ga4_reporting_purchase_events.transactionId. The small share of renewals that do
        appear carry Direct / (not set), never a paid channel.
    - issue: Recharge cancellation lag versus last billed charge
      severity: medium
      expected_prevalence: realized 15.0% of cancelled subscriptions (median lag 12 days, lagged tail 38-95 days)
      affected_systems:
        - Recharge
        - Klaviyo
      visibility: hidden_until_standardization
      rationale: Customers stop paying attention before they cancel in the portal, so cancelled_at often sits weeks after the final successful charge — naive churn dating using cancelled_at overstates tenure.
      notes: MANUAL. Signature — cancelled_at more than 35 days after the subscription's last charge date.
    - issue: Support tickets inconsistently linked to orders
      severity: medium
      expected_prevalence: realized 34.7% of tickets have no order id; 8.0% have no resolvable customer; every populated id resolves
      affected_systems:
        - Gorgias
      visibility: obvious
      rationale: Order linkage in Gorgias is agent-applied rather than automatic, and chat/social tickets frequently arrive with an unrecognised email, so support volume cannot be joined cleanly to commerce without an email fallback.
      notes: MANUAL. Signature — blank shopify_order_id on ~35% of tickets; blank/unmatched requester email on ~8%. Populated ids must still reference real orders — no orphans.
    - issue: Revenue definition mismatch between GA4 and Shopify
      severity: medium
      expected_prevalence: Every GA4 purchase row — realized mean gap £1.30, equal to the order's shipping on 100% of rows and one-directional
      affected_systems:
        - GA4
        - Shopify
      visibility: hidden_until_standardization
      rationale: GA4 purchaseRevenue is reported shipping-inclusive while the Shopify AOV convention excludes shipping, so the two systems disagree on revenue by roughly the flat £1.00-£1.99 delivery fee per order — about 6-11% on a £18 basket, which is large enough to look like a real data-quality incident.
      notes: MANUAL. Signature — ga4 purchaseRevenue minus shopify total_price equals the order's shipping amount (plus rounding), consistently and in one direction.
    - issue: Test and internal orders in the production extract
      severity: low
      expected_prevalence: realized 0.211% of orders (860 of 406,700), all £0.00 and all @getfussy.com
      affected_systems:
        - Shopify
      visibility: obvious
      rationale: Staff testing and 100%-discount internal codes leave zero-total and @getfussy.com orders in the live export — routine for a brand that ships frequent limited-edition launches.
      notes: MANUAL. Signature — total_price of 0.00 and/or internal email domains and test-pattern names; removed by the staging test-pattern battery.
    - issue: Left-censored first cohort at the window edge
      severity: medium
      expected_prevalence: ~40,500 of ~182,000 customers were already trading before the window; the 2025-03 cohort is ~23% larger than 2025-04
      affected_systems:
        - Shopify
        - Recharge
      visibility: hidden_until_standardization
      rationale: >
        Any windowed export makes long-standing customers look like new acquisitions in the first
        month, because their real first order sits before the extract starts. Cohort retention
        computed naively therefore shows an oversized, badly-behaved first cohort. Customers who
        pre-date the window carry a "legacy" tag and a created_at before 2025-03-01, so an analyst
        can find it — but only if they look.
      notes: >
        MANUAL. Signature — the 2025-03 first-order cohort is 13,299 customers against 10,841 in
        2025-04; those customers have created_at before the window start and, for subscribers, a
        recharge_subscriptions.created_at before it too.
    - issue: Promo-acquired cohort quality shift
      severity: medium
      expected_prevalence: Concentrated in the Nov 2025 and Nov 2026 Black Friday cohorts
      affected_systems:
        - Shopify
        - Recharge
      visibility: hidden_until_standardization
      rationale: Black Friday recruits discount-led buyers with lower first-order AOV, a lower Subscribe & Save take rate and weaker renewal survival than baseline cohorts — the retention story the pitch needs to be able to see.
      notes: >
        MANUAL. Realized signature — the 2025-11 first-order cohort has an AOV of £17.03 against
        £19.39 in 2025-10 (-12%) and a Subscribe & Save take rate of 0.384 against 0.435 (-5pp);
        2026-11 shows £16.21 vs £16.81 and 0.410 vs 0.474. Renewal survival for these cohorts is
        additionally scaled by 0.94 per cycle.

execution_plan:
  approval_status: approved
  current_phase: analytics_generation
  scope_summary: >
    Generate raw source-shaped datasets for the Fussy D2C store using a products-first dependency
    model over an 18 historic + 6 future month window (2025-03-01 -> 2027-02-28), UK-only and GBP,
    across Shopify, Recharge, GA4, Klaviyo, Google Ads and Gorgias. Operational row volume scaled to
    0.20; products protected. Recharge and Gorgias are new standard source systems and need one
    schema doc, one RAW_SCHEMA entry and one staging spec each, reusable by future clients.
  approved_time_window:
    historic_months: 18
    future_months: 6
    override_reason: Default window retained. Volume gating handled by row scaling rather than a window cut, because the 3-monthly refill cadence needs 18 months of history to show a cohort-retention curve.
  catalog_and_promotion_summary: >
    Ground the catalog to the live storefront — £15 starter packs, £17 limited-edition starters, £18
    refill packs, £6 single refills, £10 cases, £30/£28 scent packs, £10 mini trios, £19/£21/£12 body
    wash, £10/£18/£6 hand wash — plus three adjacent legacy SKUs. Model Subscribe & Save at ~£5 per
    refill (£15 per 3-refill delivery), Black Friday as the sharpest trading window with depressed
    AOV, and the Brazilian Summer limited edition from 2026-06 as an AOV lift. Flat delivery fee, no
    free-delivery threshold, so no basket bunching.
  metric_assumptions_summary: >
    D2C-only scale: FY Mar2025-Feb2026 £16.1m, FY Mar2026-Feb2027 £20.4m (+26%), trailing-12m to Aug
    2026 ~£18.0m. AOV £16.80 -> £18.87. Subscription order share 0.62 -> 0.68; repeat order share
    0.68 -> 0.71; refunds 1.8-2.6%. Retention is a sawtooth driven by the 3-monthly refill cadence
    (realized m1 0.34, m4 0.27, m7 0.22, m10 0.16, m13 0.11, non-cadence floor ~0.02).
  volume_summary: >
    Full-scale build projects ~14.5m raw rows, well above the 5m threshold. Historic window kept at
    18 months; operational row volume scaled to 0.20, giving ~2.9m raw rows. Klaviyo additionally
    capped by a 12 historic month source window. Products protected from scaling.
  generation_sequence:
    - step: generate_products
      depends_on: []
    - step: generate_orders
      depends_on:
        - generate_products
    - step: generate_customers
      depends_on:
        - generate_orders
        - generate_products
    - step: generate_dependent_datasets
      depends_on:
        - generate_products
        - generate_orders
        - generate_customers
  parallel_groups:
    - name: downstream_raw_sources
      members:
        - shopify_order_items
        - recharge_subscriptions
        - recharge_subscription_orders
        - ga4
        - klaviyo
        - google_ads
        - gorgias
      depends_on:
        - generate_orders
        - generate_customers
        - generate_products
  phase_gates:
    - phase: source_generation
      approval_required_before_next: true
    - phase: stage_standardization
      approval_required_before_next: true
    - phase: analytics_generation
      approval_required_before_next: false
  consistency_checks:
    - foreign_key_reconciliation
    - timestamp_plausibility
    - cross_system_entity_coverage
  validation_tests:
    - name: primary_key_uniqueness
      threshold:
        max_duplicates: 0
    - name: foreign_key_reconciliation
      threshold:
        max_orphans: 0
    - name: ga4_order_timestamp_alignment
      threshold: 30_minutes
    - name: modeling_window_bounds
      threshold:
        historic_months: 18
        future_months: 6
        window_start: 2025-03-01
        window_end: 2027-02-28
    - name: source_specific_window_bounds
      threshold:
        klaviyo_historic_months: 12
        earliest_by_file:
          klaviyo_events.csv: 2025-09-01
          google_ads_campaign_performance.csv: 2025-03-01
          gorgias_tickets.csv: 2025-03-01
          recharge_subscription_orders.csv: 2025-03-01
        # recharge_subscriptions.csv is deliberately absent: subscriptions that were already
        # running when the window opens genuinely have a created_at before 2025-03-01.
    - name: promotion_and_discount_consistency
      threshold:
        note: Monthly volume targets are promo-inclusive; validate promo effects on AOV/mix, not on monthly volume. See references/metric-definitions.md.
    - name: metric_trajectory_alignment
      threshold:
        orders_pct: 3
        revenue_pct: 6
        aov_pct: 4
  accepted_waivers: []
  open_questions:
    - Confirm whether Meta Ads is live before stage/analytics delivery; it is currently excluded on the evidence rule.
    - Confirm the D2C share of group revenue with the client; £16-20m/yr is a user-directed assumption, not a published figure.
    - UK-only scope understates the real ~15% continental Europe mix; confirm whether the pitch needs multi-market data.

generation:
  company_slug: fussy
  output_workspace: ../synthetic_data
  raw_extracts_to_build:
    - shopify_products.csv
    - shopify_orders.csv
    - shopify_customers.csv
    - shopify_order_items.csv
    - recharge_subscriptions.csv
    - recharge_subscription_orders.csv
    - ga4_reporting_purchase_events.csv
    - ga4_reporting_purchase_items.csv
    - klaviyo_events.csv
    - google_ads_campaign_performance.csv
    - gorgias_tickets.csv
  stage_outputs:
    - users.csv
    - orders.csv
  analytics_outputs:
    - monthly_cohort_retention.csv   # built 2026-08-06 with RETENTION_AS_OF_DATE=2026-08-06
  stage_notes: >
    run_staging discovered every modelled defect by profiling alone: 888 test/internal orders
    removed (tripping both test_internal_rows and implausible_amount), 3,282 duplicate display
    ids flagged and retained, 4,019 Shopify and 14,886 Klaviyo emails normalised, 506 Gorgias
    tag values collapsed for casing drift, 2,342 dunning retries flagged, 573 charges orphaned
    onto removed test orders, and 4,329 support tickets flagged as unlinkable to commerce.
    Cross-system coverage reports 48.7% of in-window orders absent from GA4 — the headline
    finding, reached without any knowledge of how the data was produced.
