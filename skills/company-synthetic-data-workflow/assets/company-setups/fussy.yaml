    seasonality_notes:
      - >
        Seasonality is BAKED INTO orders_by_period, not applied as a separate multiplier layer by
        the generator. The multipliers below are documentation of the shape already present in the
        monthly path — the generator pins order counts to orders_by_period.
      - Normalised monthly multipliers (mean 1.000) — Jan 1.039, Feb 0.905, Mar 0.933, Apr 0.962, May 1.020, Jun 1.059, Jul 1.078, Aug 1.001, Sep 0.924, Oct 0.953, Nov 1.116, Dec 1.010.
      - Summer (Jun-Jul) is the deodorant demand peak; November is the Black Friday trading peak with depressed realised AOV; February and September are the troughs.
      - The subscription base damps amplitude — renewals are contractual, so seasonality mostly moves new-customer acquisition.
    inflection_points:
      - date: 2025-08-20
        metric: category_expansion_body_wash
        expected_change: Body wash range goes live. From 2025-09 the monthly order path steps up ~3.5% and AOV steps up ~£0.35 as body wash starter packs (£19) and refill packs (£21) enter the mix.
        rationale: products.json published_at for the first Body Wash Refills and Bottles is 2025-08-20.
      - date: 2025-11-20
        metric: category_expansion_hand_wash
        expected_change: Hand wash range goes live (bottles 2025-11-20, refill packs 2025-12-11). From 2025-12 the order path steps up a further ~2.5% and AOV a further ~£0.25.
        rationale: products.json published_at for the first Hand Wash Bottle is 2025-11-20 and Hand Wash Refills 2025-12-11.
      - date: 2026-05-18
        metric: limited_edition_launch
        expected_change: Brazilian Summer limited edition (Mango Mood, Sweet Escape, After Sun) at a £17/£18/£28 premium. From 2026-06 the order path steps up ~2% and AOV a further ~£0.20; summer months carry a +1.5% AOV mix effect.
        rationale: products.json published_at 2026-05-18 and the live homepage banner on 2026-08-06.
      - date: 2025-11-24
        metric: channel_attribution_break
        expected_change: GA4 Unassigned share rises from the ~8% baseline to ~22% for ~8 days during the Black Friday tag/consent changes, then returns to baseline.
        rationale: CookieYes consent management plus GTM and the Littledata Shopify tracker are all live on-site; a Cyber Week tagging change is the most believable cause of a tracking gap.
      - date: 2026-04-13
        metric: channel_attribution_break
        expected_change: Second, shorter Unassigned spike to ~20% for ~7 days.
        rationale: Consent-mode / Littledata tracker reconfiguration; keeps breaks sparse and plausible per references/channel-mix-benchmarks.md.
