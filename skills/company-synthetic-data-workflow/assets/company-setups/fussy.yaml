company:
  name: Fussy
  website: https://www.getfussy.com/
  generated_on: 2026-08-06
  time_window:
    historic_months: 18
    future_months: 6
    override_reason: Using the default 18 historic + 6 future window (2025-03-01 -> 2027-02-28). Brand has traded since 2020, so the window start does not predate launch. Window kept at 18 months because the subscription refill cadence (renewals at months 1, 4, 7, 10, 13) needs a long history for the cohort-retention story; volume is controlled by operational row scaling instead — see volume_plan.
  primary_market: UK
  currency: GBP
  category: Personal care
  subcategory: Refillable natural deodorant, body wash and hand wash
  business_model: Subscription-led D2C replenishment (refills) with one-time purchases; omnichannel group with grocery/pharmacy retail listings that are out of scope here
  confidence_note: >
    Catalog, prices and range-launch dates are grounded in the live Shopify storefront
    (products.json pulled 2026-08-06, 184 products with published_at dates). Source systems are
    grounded in a site technology-profiler pass over the rendered homepage on 2026-08-06.
    Commercial scale is a user-directed assumption: public reporting puts group run-rate above
    £30m (Aug 2025) including Tesco/Sainsbury's/Waitrose/Boots retail, and the user directed a
    D2C-only model at roughly £16-20m/yr. Market scope is user-directed UK-only even though the
    store sells into ~30 countries and continental Europe is publicly reported at ~15% of group
    revenue — see execution_plan.open_questions.

source_time_windows:
  default:
    historic_months: 18
    future_months: 6
  overrides:
    - system_name: Klaviyo
      historic_months: 12
      future_months: 6
      rationale: Trim the email/SMS event stream to the last 12 historic months (from 2025-09-01) to control row volume while preserving the lifecycle story. Anchored to customers and orders.
      anchor_to_tables:
        - customers
        - orders

volume_plan:
  estimated_raw_rows:
    products: 130
    orders: 406700
    customers: 150000
    order_items: 875000
    crm_events: 520000          # klaviyo_events.csv, 12 historic + 6 future months
    ga4_events: 189000          # web-checkout orders only; Recharge renewals bypass the pixel
    ga4_event_items: 405000
    subscriptions: 105000       # recharge_subscriptions.csv
    subscription_orders: 224000 # recharge_subscription_orders.csv (charges)
    ad_performance: 10200       # google_ads_campaign_performance.csv
    support_tickets: 10200      # gorgias_tickets.csv
    total: 2895000
  threshold_total_raw_rows: 5000000
  protected_dimensions:
    - products
  reduction_actions:
    reduce_historic_window_to_months:
    row_volume_scaling_factor: 0.20
    rationale: >
      At full modelled scale the business does ~2.03m orders across the 24-month window
      (~85k orders/month at a ~£18 AOV), which projects to ~14.5m raw rows — far above the 5m
      threshold. Cutting the historic window to 12 months only removes ~30% of that and would
      still breach the threshold while destroying the cohort-retention depth this brand's story
      depends on, so the window is kept at 18+6 and operational row volume is scaled to 0.20
      instead. All commercial metrics, growth, seasonality, AOV, mix, retention and issue
      prevalence are preserved: volume and revenue targets are compared at target x 0.20, and
      rates (AOV, refund rate, subscription share, retention) are scale-invariant. Products are a
      protected dimension and stay complete.

