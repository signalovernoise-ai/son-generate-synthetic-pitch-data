      more slowly than the group.
    repeat_rate_range: repeat order-share ~0.68-0.71; subscription order-share ~0.62 rising to ~0.68 (renewals alone ~0.52 of orders); Subscribe & Save take-rate ~0.50 of first orders; ~3.5 renewals per subscriber; ~3.3 orders per active customer over the 24-month window
