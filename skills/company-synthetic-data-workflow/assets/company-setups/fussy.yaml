  summary: >
    Fussy is a UK D2C personal-care brand selling refillable natural deodorant plus body wash and
    hand wash, on Shopify. The model is a durable case bought once plus plastic-free refills bought
    forever: a Subscribe & Save starter pack (case + 1 refill, £15) followed a month later by a
    rolling 3-monthly supply of 3 refills at ~£5 each (£15/delivery, ~17% below the £18 one-time
    3-pack and ~25% below buying singles at £6). That cadence — renewals at months 1, 4, 7, 10, 13 —
    is the defining shape of the retention curve. Founded 2020, Dragons' Den investment from Deborah
    Meaden and Peter Jones (Feb 2022), £1.1m crowdfund at a £6.2m valuation, further VC from Guinness
    Ventures and Velocity (Mar 2024, Mar 2025). Group run-rate reported above £30m by Aug 2025 with
    listings in Tesco, Sainsbury's, Waitrose, Boots, Superdrug and Holland & Barrett; this dataset
    models the D2C store only. Range expansion is the main in-window growth driver: body wash went
    live 2025-08-20 and hand wash 2025-11-20, both evidenced by products.json published_at dates.
