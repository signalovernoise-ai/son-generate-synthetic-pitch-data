    bundles:
      - Starter Pack (case + refill)
      - Scent Pack (case + 3 refills)
      - Refill Pack (3 refills)
      - Mini Trio Pack
    subscription: available
    subscription_platform: Recharge
    subscription_modeling: >
      Modelled as a first-class Recharge source (subscriptions + charge-level subscription orders)
      that references the Shopify order the charge created, plus selling-plan fields on the Shopify
      line items. Cadence: starter pack, first refill delivery ~1 month later, then a rolling
      3-monthly 3-refill supply — renewals land at months 1, 4, 7, 10, 13 from the first order.
    promotions:
      - offer_name: Subscribe & Save
        offer_type: Subscription discount
        details: Refills at ~£5.00 each on subscription (£15.00 per 3-refill delivery) vs £18.00 one-time and £6.00 as singles — ~17% off the pack, marketed as "over 25%" vs buying singles. Free UK shipping on the initial Subscribe & Save starter (case + refill).
        evidence_source: https://www.getfussy.com/pages/subscribe and https://www.getfussy.com/pages/deodorant
      - offer_name: Black Friday / Cyber Week
        offer_type: Sitewide seasonal discount
        details: Modelled as the sharpest trading window of the year (Nov seasonality 1.12x vs the mean month) with realised AOV depressed ~4.5% by discounting. Assumption grounded in category norms, not a captured 2025 banner.
        evidence_source: assumption (category norm; not observed on-site in Aug 2026)
      - offer_name: Brazilian Summer limited edition
        offer_type: Limited-edition range
        details: Limited-edition scents (Mango Mood, Sweet Escape, After Sun) live from 2026-05-18 at a £17 starter / £18 refill pack / £28 scent pack premium; banner "SHOP OUR LIMITED EDITION SCENTS" live on the homepage 2026-08-06. Modelled as a summer AOV lift, not an extra volume lift.
        evidence_source: https://www.getfussy.com/ and products.json published_at 2026-05-18
      - offer_name: Refer a Friend
        offer_type: Referral credit
        details: A Refer a Friend link sits in the site navigation; modelled as a small referral-attributed share of new customers with a first-order credit.
        evidence_source: https://www.getfussy.com/ (main navigation)
    delivery_pricing:
      free_delivery_threshold:
      delivery_policy_summary: >
        No spend-based free-delivery threshold. UK delivery is charged as a low flat fee — ~£1.00 on
        subscription refill-only deliveries and ~£1.99 on other orders — with free UK shipping on the
        initial Subscribe & Save starter pack. Because shipping is a flat fee rather than a threshold,
        there is no basket-bunching effect to model. Shipping is excluded from AOV and revenue per
        references/metric-definitions.md, but is still populated on the Shopify order so that the GA4
        revenue-definition mismatch (see data_issues) is real and reconcilable.
      evidence_source: https://getfussy.gorgias.help/en-US/articles/shipping-delivery-and-returns-97528 and https://www.getfussy.com/pages/subscribe
