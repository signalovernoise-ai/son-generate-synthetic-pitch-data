    # Subscription cadence dominates the curve: the Subscribe & Save starter is followed by a
    # refill delivery ~1 month later, then a rolling 3-monthly supply. Renewal months are
    # 1, 4, 7, 10, 13; the months in between carry only a one-time-repeat floor (~4-5%). The
    # resulting sawtooth is a real feature of this business, not noise.
    #
    # These figures are the internally consistent solution of the order-mix identity
    #   1 = new_share x (1 + take_rate x renewals_per_subscriber) + adhoc_repeat_share
    # at take_rate 0.50, renewals per subscriber ~3.3 and adhoc repeat share 0.16. Renewal
    # survival is 0.86 to the first refill delivery then 0.80 / 0.78 / 0.70 / 0.70 per cycle.
    # Values below are REALIZED from the generated data (cohorts 2025-04..2026-02), not a
    # pre-generation guess: the first draft's checkpoints could not be reconciled with the
    # documented new/repeat and subscription mix and were corrected here.
    retention_checkpoints:
      m1: 0.337
      m3: 0.117
      m6: 0.089
      m12: 0.053
    retention_cadence_months:
      m4: 0.272
      m7: 0.216
      m10: 0.156
      m13: 0.105
    retention_shape_notes:
      - Non-cadence months carry a decaying one-time-repeat floor of ~0.024 -> ~0.018.
      - A secondary bump at m3 / m6 / m9 (0.12 / 0.09 / 0.07) comes from renewals rescheduled a month early or late, which is genuine Recharge skip/delay behaviour rather than noise.
      - >
        Two definitions give two curves and both are correct. The checkpoints above use a
        CALENDAR-MONTH offset. The monthly_cohort_retention analytics output buckets by
        ELAPSED 30-DAY PERIODS from the exact first-order timestamp, which splits the ~30-day
        first refill delivery across buckets 0 and 1 and discards bucket 0 — so it reads lower:
        m1 0.214, m4 0.215, m7 0.178, m10 0.131, m13 0.086, with troughs of 0.02-0.04 between.
        Quote whichever definition the audience expects, but never mix them in one chart.
