company:
  name: YuMOVE
  website: https://yumove.co.uk/
  generated_on: 2026-05-30
  time_window:
    historic_months: 12
    future_months: 6
    override_reason: Reduce the default 18-month history to 12 months because the projected raw-source build would otherwise exceed the workflow volume threshold.
  primary_market: GB
  currency: GBP
  category: Pet supplements
  subcategory: Joint support and digestive health
  business_model: Mixed one-off and subscription D2C
  confidence_note: Company context, priorities, and systems are grounded in the provided email thread plus current public website and corporate sources.

source_time_windows:
  default:
    historic_months: 12
    future_months: 6
  overrides:
    - system_name: Bloomreach
      historic_months: 3
      future_months: 6
      rationale: Lifecycle data is intentionally shortened to limit row counts and reflect a recent-system view.
      anchor_to_tables:
        - users
        - orders
    - system_name: Triple Whale
      historic_months: 9
      future_months: 6
      rationale: User-approved assumption that Triple Whale was only implemented 9 months ago.
      anchor_to_tables:
        - orders
        - order_items

volume_plan:
  estimated_raw_rows:
    products: 42
    orders: 145000
    customers: 100000
    order_items: 350000
    crm_events: 180000
    attribution_events: 300000
    support_tickets: 16000
    total: 1700000
  threshold_total_raw_rows: 5000000
  protected_dimensions:
    - products
  reduction_actions:
    reduce_historic_window_to_months: 12
    row_volume_scaling_factor: 0.15
    rationale: Preserve the approved business metrics, growth, retention, promo effects, and issue prevalence while keeping raw-source generation and validation manageable. Low-row-count dimensions such as products should remain complete and not be reduced by this scaling rule.

