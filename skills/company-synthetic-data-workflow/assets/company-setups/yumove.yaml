source_systems:
  confirmed:
    - name: Shopify
      confirmation_source: call_note_confirmed
      evidence_links:
        - "/Users/julian/Downloads/Jenny + Tushar + Johannes.eml"
      evidence_notes: Email thread explicitly states Shopify for web.
      domain: commerce
      export_shape: standard connector schema
      platform_resources:
        - products
        - orders
        - customers
        - order_items
      join_keys:
        - product_id
        - variant_id
        - order_id
        - customer_id
      schema_basis: official documentation
      schema_notes: Subscription identification should use selling-plan data on line items, not a simplistic order-level boolean.
      known_limitations:
        - No universally reliable order-level subscription flag in standard Shopify exports.
    - name: OrderGroove
      confirmation_source: call_note_confirmed
      evidence_links:
        - "/Users/julian/Downloads/Jenny + Tushar + Johannes.eml"
      evidence_notes: Email thread explicitly states Shopify with OrderGroove for subscription.
      domain: subscriptions
      export_shape: vendor export
      platform_resources:
        - subscriptions
        - subscription_orders
        - events
      join_keys:
        - subscription_id
        - customer_id
        - order_id
      schema_basis: official documentation
      schema_notes: Treat OrderGroove as the authoritative source for subscription contracts and recurring order context.
      known_limitations:
        - Some history may need to be anchored back to Shopify order and customer entities.
    - name: GA4
      confirmation_source: user_confirmed
      evidence_links:
        - "/Users/julian/Downloads/Jenny + Tushar + Johannes.eml"
      evidence_notes: The email says GA, and the user explicitly clarified that this means GA4.
      domain: web_analytics
      export_shape: reporting_api
      platform_resources:
        - purchase_events
        - purchase_items
      join_keys:
        - transactionId
      schema_basis: official documentation
      schema_notes: Use the reporting/API-aligned schema, not BigQuery export, for this workflow.
      known_limitations:
        - Channel breakage and unattributed spikes are intentionally modeled in a few short windows.
    - name: Bloomreach
      confirmation_source: user_confirmed
      evidence_links:
        - "/Users/julian/Downloads/Jenny + Tushar + Johannes.eml"
      evidence_notes: Email says the business is migrating to Bloomreach CRM and the user asked to use Bloomreach rather than Emarsys.
      domain: lifecycle
      export_shape: vendor export
      platform_resources:
        - campaign_events
      join_keys:
        - email
        - customer_id
      schema_basis: official documentation
      schema_notes: Limit lifecycle generation to 3 historic months and 6 future months and anchor records to users and orders.
      known_limitations:
        - Shorter time window is intentional to control volume and reflect a more recent lifecycle view.
    - name: Zendesk
      confirmation_source: call_note_confirmed
      evidence_links:
        - "/Users/julian/Downloads/Jenny + Tushar + Johannes.eml"
      evidence_notes: Email explicitly states Zendesk for customer care.
      domain: support
      export_shape: vendor export
      platform_resources:
        - tickets
      join_keys:
        - customer_id
        - order_id
        - email
      schema_basis: official documentation
      schema_notes: Restrict to pet-owner tickets only for simplicity.
      known_limitations:
        - Exclude broader contact-us or unrelated support themes from this phase.
    - name: Triple Whale
      confirmation_source: user_confirmed
      evidence_links:
        - "/Users/julian/Downloads/Jenny + Tushar + Johannes.eml"
      evidence_notes: Email references Triple Whale as the in-week directional check and the user asked to assume only 9 months of history.
      domain: attribution
      export_shape: api
      platform_resources:
        - attributed_orders
        - customer_journey_events
      join_keys:
        - order_id
        - customer_id
      schema_basis: official documentation
      schema_notes: Only 9 historic months should be generated because implementation is assumed to be recent.
      known_limitations:
        - Attribution continuity should intentionally show a few channel-breakage windows.
    - name: Stape
      confirmation_source: call_note_confirmed
      evidence_links:
        - "/Users/julian/Downloads/Jenny + Tushar + Johannes.eml"
      evidence_notes: Email explicitly references Stape server-side tracking.
      domain: tracking_infrastructure
      export_shape: none
      platform_resources: []
      join_keys: []
      schema_basis: client-provided schema notes
      schema_notes: Confirmed context system only; no raw source file will be generated in phase 1.
      known_limitations:
        - Tracking behavior is expressed through GA4 and Triple Whale effects rather than a separate Stape extract.
  open_questions: []

standardization:
  canonical_tables:
    - users
    - orders
  mapping_notes:
    - No stage or analytics outputs should be generated until raw source outputs are generated, validated, and reviewed.

data_issues:
  selected:
    - issue: Email casing or whitespace drift
      severity: low
      expected_prevalence: 1-3% of Shopify and Bloomreach customer/contact records
      check: email_casing_or_whitespace_drift
      expected_prevalence_range: [0.01, 0.03]
      affected_systems:
        - Shopify
        - Bloomreach
      visibility: subtle
      rationale: Common and believable identity-normalization issue across commerce and lifecycle systems.
      notes: Use lower/trim normalization to reconcile.
    - issue: Guest or lifecycle identity fragmentation
      severity: medium
      expected_prevalence: 3-6% of lifecycle-linked users
      affected_systems:
        - Shopify
        - Bloomreach
        - GA4
      visibility: subtle
      rationale: Believable across D2C commerce and lifecycle joins, especially around CRM migration and guest behavior.
      notes: Some lifecycle or analytics entities should require fallback matching rather than a perfect key join.
    - issue: Partial attribution coverage
      severity: medium
      expected_prevalence: 5-12% of attributed order joins
      check: partial_attribution_coverage
      expected_prevalence_range: [0.05, 0.12]
      affected_systems:
        - GA4
        - Triple Whale
      visibility: subtle
      rationale: Fits the recent Triple Whale implementation and general attribution incompleteness.
      notes: Model as genuinely missing Triple Whale rows (orders present in commerce but absent downstream), not merely a channel value. See references/channel-mix-benchmarks.md.
    - issue: Channel tracking breakage with unattributed spike
      severity: medium
      expected_prevalence: 3 short windows across the 18-month operational horizon
      check: channel_tracking_break
      affected_systems:
        - GA4
        - Triple Whale
      visibility: obvious
      rationale: User explicitly requested channel tracking to break at a few points in the series.
      notes: Baseline unattributed ~7-10%; spike to ~19-25% in short windows. Do not stack multiple unattributed code paths. See references/channel-mix-benchmarks.md.
    - issue: Recent-system-window truncation
      severity: medium
      expected_prevalence: Systemic by design for Bloomreach and Triple Whale
      affected_systems:
        - Bloomreach
        - Triple Whale
      visibility: obvious
      rationale: Approved shorter windows for these systems should read like genuine implementation-history constraints.
      notes: Keep lifecycle and attribution history intentionally shorter than core commerce history.
    - issue: Enum and status drift
      severity: low
      expected_prevalence: Low scattered prevalence across CRM and support exports
      affected_systems:
        - Bloomreach
        - Zendesk
      visibility: subtle
      rationale: Realistic export inconsistency without overwhelming the dataset.
      notes: Include small casing or status-variant inconsistencies.
    - issue: Promo-acquired cohort quality shift
      severity: medium
      expected_prevalence: Concentrated around visible discount windows
      affected_systems:
        - Shopify
        - OrderGroove
        - GA4
        - Triple Whale
      visibility: hidden_until_standardization
      rationale: Believable and analytically useful given the live visible promotional mechanics.
      notes: Promo cohorts should show lower initial AOV and different repeat behavior than baseline cohorts.
    - issue: Duplicate-looking operational rows
      severity: low
      expected_prevalence: Less than 0.5% of selected operational datasets
      check: near_duplicate_orders
      expected_prevalence_range: [0.0005, 0.005]
      affected_systems:
        - Shopify
        - Zendesk
      visibility: subtle
      rationale: Light operational mess improves realism without making the sources look broken.
      notes: Keep this sparse and platform-appropriate (e.g. duplicate-looking order names while the underlying id stays unique).

execution_plan:
  approval_status: approved
  current_phase: source_generation
  scope_summary: Generate only raw source-shaped datasets for YuMOVE using a products-first dependency model, reduced to 12 historic months plus 6 future months with operational row scaling to keep the build practical.
  approved_time_window:
    historic_months: 12
    future_months: 6
    override_reason: Reduced from the default 18 historic months after the workflow volume gate projected an unwieldy raw-source build.
  catalog_and_promotion_summary: Ground products to the current YuMOVE site catalog and visible live promotions, model free UK delivery, and carry promo mechanics into historical and future order behavior where appropriate.
  metric_assumptions_summary: Model the yumove.co.uk store at a realistic business scale of 18.5m in 2024, 21.5m in 2025, and 24.8m in 2026, but generate only a 0.15x representative operational slice that preserves growth, AOV, retention, seasonality, subscription mix, and promo effects.
  volume_summary: Estimated full-scale raw generation would likely exceed 5 million rows, so the approved plan reduces history to 12 months and scales operational row counts to 0.15x, bringing projected raw rows down to roughly 1.7 million. Products are treated as a protected low-row-count dimension and should not be reduced by the operational scaling rule.
  generation_sequence:
    - step: generate_products
      depends_on: []
    - step: generate_orders
      depends_on:
        - generate_products
    - step: generate_customers
      depends_on:
        - generate_orders
        - generate_products
    - step: generate_dependent_datasets
      depends_on:
        - generate_products
        - generate_orders
        - generate_customers
  parallel_groups:
    - name: downstream_raw_sources
      members:
        - shopify_order_items
        - ordergroove
        - ga4
        - bloomreach
        - zendesk
        - triple_whale
      depends_on:
        - generate_orders
        - generate_customers
        - generate_products
  phase_gates:
    - phase: source_generation
      approval_required_before_next: true
    - phase: stage_standardization
      approval_required_before_next: true
    - phase: analytics_generation
      approval_required_before_next: false
  consistency_checks:
    - foreign_key_reconciliation
    - timestamp_plausibility
    - cross_system_entity_coverage
  validation_tests:
    - name: primary_key_uniqueness
      threshold:
        max_duplicates: 0
    - name: foreign_key_reconciliation
      threshold:
        max_orphans: 0
    - name: ga4_order_timestamp_alignment
      threshold: 30_minutes
    - name: modeling_window_bounds
      threshold:
        historic_months: 12
        future_months: 6
        window_start: 2025-06-01
        window_end: 2026-11-30
    - name: source_specific_window_bounds
      threshold:
        bloomreach_historic_months: 3
        triple_whale_historic_months: 9
        earliest_by_file:
          bloomreach_campaign_events.csv: 2026-03-01
          triple_whale_attributed_orders.csv: 2025-09-01
    - name: promotion_and_discount_consistency
      threshold:
        note: Monthly volume targets are promo-inclusive; validate promo effects on AOV/mix, not on monthly volume. See references/metric-definitions.md.
    - name: metric_trajectory_alignment
      threshold:
        orders_pct: 3
        revenue_pct: 6
        aov_pct: 4
    - name: operational_row_volume_scaling
      threshold:
        scaling_factor: 0.15
  # Known, signed-off deviations. These checks report WAIVED instead of FAIL so the
  # gate can pass; revisit by recalibrating choose_product_mix to net-of-discount price.
  accepted_waivers:
    - check: metric_trajectory:revenue
      reason: AOV calibration deferred; basket targets gross compare_at_price so realized revenue runs ~14% low.
    - check: metric_trajectory:AOV
      reason: AOV calibration deferred; realized net AOV runs ~12% below documented trajectory.
  open_questions: []

