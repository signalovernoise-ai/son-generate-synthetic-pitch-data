    - https://sunnasupplements.com/pages/contact
    - https://us.sunnasupplements.com/ (separate US Shopify store, shop id 0854/6612/0457)
    - https://find-and-update.company-information.service.gov.uk/company/14298073 (SUNNA SUPPLEMENTS LTD)
    - https://find-and-update.company-information.service.gov.uk/company/14298073/filing-history (accounts to 31 Dec 2024, filed 30 May 2025)
    - https://www.facebook.com/ads/library/ (GB, keyword "Sunna Supplements", checked 2026-08-13 — ~170 results, page facebook.com/sunnasupps)
    - https://library.tiktok.com/ads (GB, advertiser "SUNNA SUPPLEMENTS LTD", checked 2026-08-13 — 1,034 ads in 2026 YTD, latest 12/08/2026)
    - Rendered-homepage / contact-page / PDP technology-profiler pass, 2026-08-13 (script tags, Shopify app extension asset URLs, web-pixels config list, tag ids, response headers)
  summary: >
    Sunna Supplements is a UK D2C supplements brand positioning itself as "the world's 1st halal
    supplement brand", incorporated 2022-08-16 and founded by Hamza Hanif. It sells halal-certified
    collagen, vitamins, minerals, electrolytes and sports nutrition on Shopify, direct to a
    predominantly British Muslim audience. The hero product is Halal Collagen Protein (bovine, GBP 25
    for one pouch); almost every product is sold as a 1 / 3 / 6-month supply variant, so a multi-month
    "supply" is a single order line, not a multi-line basket. Delivery is blanket free 24h tracked
    shipping with no spend threshold, so there is no basket-bunching effect. Growth is paid-social led
    and heavy: ~170 active Meta ads in GB and 1,034 TikTok ads in 2026 YTD, plus Google Ads, Klaviyo
    email/SMS, Skio subscriptions and Polar Analytics as the BI layer. The catalog roughly quintupled
    across the window — a December 2024 core range (Marine Collagen, Omega 3, D3 & K2, Turmeric,
    Magnesium), a July 2025 expansion wave (Black Seed Oil, Electrolytes, Collagen Sachets, Mango Lassi
    collagen drink), an October/November 2025 sports-nutrition and free-gift-funnel push (Creatine,
    duo bundles, GBP 0.00 shaker and "Blueprint" lead magnets), a December 2025 winter-immunity trio
    (Iron Complex, Halal Immunity, Black Seed Oil Softgels) and Probiotic in April 2026. A separate US
    Shopify store went live around October 2025 with its own GA4 property and Google Ads account. The
    defining commercial feature is Islamic-calendar seasonality: Ramadan and Eid are the peak trading
    windows and they migrate ~11 days earlier each year, so the peak moves from March 2025 to
    February/March 2026 to early February 2027.
