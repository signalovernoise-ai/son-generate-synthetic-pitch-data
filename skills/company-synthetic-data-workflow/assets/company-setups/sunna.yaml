    subscription: available
    subscription_platform: Skio
    subscription_modeling: >
      Modelled as a first-class Skio source (subscriptions + charge-level subscription orders) that
      references the Shopify order the charge created, plus selling-plan fields on the Shopify line
      items. Skio is confirmed by the skio-subscriptions-yc-s20 app extension and the
      subscriptions-23-158 referral-banner assets on the rendered storefront. The live PDP exposes two
      parallel selling-plan groups at 20% and 10% price adjustments, each with 1 Month / 3 Months /
      6 Months delivery intervals — modelled as a 20% "Subscribe & Save" plan on hero SKUs and a 10%
      plan elsewhere. Cadence is dominated by the 1-month interval (monthly collagen replenishment),
      which gives a smooth decaying retention curve rather than Fussy's sawtooth, with minor bumps at
      m3 / m6 from the 3-month and 6-month intervals.
    promotions:
      - offer_name: Newsletter welcome offer
        offer_type: First-order discount
        details: 10% off the first order for newsletter signup, captured through the Klaviyo onsite form. Modelled as a first-order discount on ~40% of new-customer orders.
        evidence_source: https://sunnasupplements.com/ (Klaviyo onsite embed, company_id XGGzp5)
      - offer_name: Subscribe & Save
        offer_type: Subscription discount
        details: Skio selling plans at 20% (hero SKUs) and 10% (rest) off, at 1 / 3 / 6-month delivery intervals. Applied to every subscription first order and renewal.
        evidence_source: https://sunnasupplements.com/products/halal-collagen-protein (selling_plan_groups price_adjustments 20 and 10)
      - offer_name: Multi-month supply discount
        offer_type: Volume discount baked into the price ladder
        details: >
          3-month and 6-month variants are priced ~25% and ~33% below the 1-month unit rate
          (e.g. Halal Collagen 1 Pouch GBP 25.00, 3 Pouches GBP 56.25 vs compare_at GBP 75.00,
          6 Pouches GBP 99.97 vs compare_at GBP 150.00). This is the single biggest AOV driver and
          is a list-price discount, so basket calibration must target the NET price per
          references/metric-definitions.md.
        evidence_source: https://sunnasupplements.com/products.json (compare_at_price on 3/6-month variants)
      - offer_name: Referral programme
        offer_type: Referral credit
        details: Skio Referrals banner is live on the storefront ("Referral discount applied to cart! Create your first order to claim your discount!"). Modelled as ~4% of new customers arriving referral-attributed with a first-order credit.
        evidence_source: https://sunnasupplements.com/ (skio-referrals.js, SkioReferralBanner)
      - offer_name: Ramadan and Eid trading windows
        offer_type: Seasonal sitewide discount
        details: >
          The sharpest trading windows of the year, driven by the Islamic calendar rather than the
          Gregorian one. Modelled as the peak volume months with realised AOV depressed ~2-2.5% by
          discounting, and with a distinctive bulk-buying mix shift toward 3-month and 6-month supplies.
        evidence_source: Suhoor Support + (products.json published_at 2025-04-07) plus Ramadan 1446/1447/1448 dates; sitewide banner not captured, so the discount depth is an assumption
      - offer_name: Black Friday / Cyber Week
        offer_type: Sitewide seasonal discount
        details: Modelled as a November volume peak (~1.12x the mean month) with realised AOV depressed ~5.5%. Category norm, not a captured 2025 banner.
        evidence_source: assumption (category norm; not observed on-site 2026-08-13)
      - offer_name: Gift with purchase
        offer_type: Free product line
        details: >
          "Tropical Refresh Electrolytes + 3 FREE Gifts (Worth GBP 50)" plus standalone GBP 0.00 SKUs
          (BPA-Free Shaker, Collagen Blueprint, Hydration Blueprint). Modelled as genuine GBP 0.00 order
          lines, which is also a selected data issue.
        evidence_source: https://sunnasupplements.com/products.json (price 0.00 with compare_at 9.95 / 19.95)
      - offer_name: Live percentage-off badges
        offer_type: Ongoing product-level discount
        details: Halal Immunity GBP 25.00 -> GBP 19.99 (SAVE 21%), Collagen 3 Month Supply GBP 75.00 -> GBP 56.25 (SAVE 25%), Probiotic 3 Months GBP 90.00 -> GBP 45.00 — all live on the homepage 2026-08-13.
        evidence_source: https://sunnasupplements.com/ and products.json compare_at_price
    delivery_pricing:
      free_delivery_threshold:
      delivery_policy_summary: >
        Blanket free delivery with NO spend threshold — "Free 24H Tracked Shipping" is stated in the
        site header, footer and cart drawer. Orders ship within 2 business days, primarily via Amazon
        Express Shipping. Because shipping is free rather than threshold-gated, there is no
        basket-bunching effect to model and shipping is 0.00 on every Shopify order, so the
        GA4-vs-Shopify shipping revenue mismatch that applies to flat-fee brands does NOT apply here.
        A separate optional Navidium shipping-protection line (GBP 0.99 upward) does appear on some
        orders and is modelled as a data issue instead.
      evidence_source: https://sunnasupplements.com/policies/shipping-policy and https://sunnasupplements.com/ (header/footer "Free 24H Tracked Shipping")
  commercial_assumptions:
    annual_revenue_assumption: 11632000   # trailing 12 months to 2026-08
    annual_growth_rates:
      - period: FY_Mar2026_Feb2027_vs_FY_Mar2025_Feb2026
        growth_rate: 1.58
    monthly_orders_assumption: 23300      # 2026-08
    aov_assumption: 43.67                 # 2026-08
    growth_trend: >
      Fast but decelerating scale-up: ~5.5% month-on-month underlying growth at the start of the window
      easing to ~2.2% by the end, on top of five evidenced catalog step changes (2025-07 range wave,
      2025-10/11 sports-nutrition and duo bundles, 2025-12 immunity trio, 2026-04 Probiotic) and
      Islamic-calendar seasonality. Derived calendar-year revenue: CY2024 ~GBP 4.2m (inferred from
      filed accounts), CY2025 ~GBP 8.4m (+100%), CY2026 ~GBP 13.5m (+61%).
    repeat_rate_range: repeat order-share ~0.38 rising to ~0.48; subscription order-share ~0.27 rising to ~0.36; Subscribe & Save take-rate ~0.17 rising to ~0.22 of first orders; ~1.6 rising to ~2.1 renewals per subscriber; ~1.7 orders per acquired customer over the 24-month window
    refund_rate_range: 0.024-0.040
    scale_note: >
      DERIVED, NOT PUBLISHED. Companies House accounts for the 16-month period ended 31 Dec 2024 were
      filed without a profit and loss account (the Management Information section is excluded from the
      public filing), so turnover is not disclosed. The scale anchor is built from three balance-sheet
      facts in that filing: corporation-tax creditor GBP 148,487 (implying taxable profit ~GBP 594k at
      25%), retained earnings rising GBP 37,036 -> GBP 347,027 (post-tax profit ~GBP 310k over the 16
      months, so pre-tax ~GBP 458k), and closing stock GBP 292,652 against trade creditors GBP 414,974.
      At a D2C supplement gross margin of ~73-75% and a net margin of ~10%, that implies ~GBP 4.6m of
      revenue over the 16 months; stock turning ~4x/yr against ~26% COGS independently implies
      ~GBP 4.5m annualised. Both routes land on CY2024 ~GBP 4.0-4.5m, taken as GBP 4.2m. Growth from
      there to CY2025 ~GBP 8.4m and CY2026 ~GBP 13.5m is an ESTIMATE informed by the catalog expanding
      from ~6 to 32 products, the US store launch, and paid-media intensity (1,034 GB TikTok ads in 2026
      YTD, ~170 active GB Meta ads). It is not a published or client-confirmed figure and must be
      signed off before the dataset is used in a pitch.
