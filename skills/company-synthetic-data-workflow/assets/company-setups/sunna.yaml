company:
  name: Sunna Supplements
  website: https://sunnasupplements.com/
  generated_on: 2026-08-13
  time_window:
    historic_months: 18
    future_months: 6
    override_reason: Using the default 18 historic + 6 future window (2025-03-01 -> 2027-02-28). The brand incorporated 2022-08-16 and was already trading, so the window start does not predate launch. 18 months is required rather than 12 because the window must contain two full Ramadan trading peaks (Mar 2025 and Feb/Mar 2026) for the Islamic-calendar seasonality story to be visible at all; a 12-month cut would leave only one.
  primary_market: UK
  currency: GBP
  category: Health and wellness
  subcategory: Halal-certified supplements (collagen, vitamins, minerals, electrolytes, sports nutrition)
  business_model: Paid-social-led D2C supplements on Shopify, one-time purchase dominant with a Skio Subscribe & Save subscription layer and multi-month supply bundles
  confidence_note: >
    Catalog, prices, variant structure and launch dates are grounded in the live Shopify storefront
    (products.json pulled 2026-08-13; 32 products). Source systems are grounded in a technology-profiler
    pass over the rendered UK homepage, contact page and a PDP on 2026-08-13, plus the Meta Ad Library
    (GB) and the TikTok Commercial Content Library (GB), both checked 2026-08-13. Commercial scale is
    DERIVED, not published: Companies House accounts to 31 Dec 2024 were filed without a profit and loss
    account, so revenue is inferred from the corporation-tax creditor (GBP 148,487), the movement in
    retained earnings (GBP 37,036 -> GBP 347,027) and closing stock (GBP 292,652). See
    research.commercial_assumptions.scale_note. Growth from that base is an estimate, not evidence.
    No support/helpdesk system could be detected — see execution_plan.open_questions.

source_time_windows:
  default:
    historic_months: 18
    future_months: 6
  overrides:
    - system_name: Klaviyo
      historic_months: 12
      future_months: 6
      rationale: Trim the email/SMS event stream to the last 12 historic months (from 2025-09-01) to control row volume while preserving the lifecycle story. Anchored to customers and orders.
      anchor_to_tables:
        - customers
        - orders

volume_plan:
  # REALIZED counts from the build of 2026-08-13 (estimates in brackets where they differed).
  estimated_raw_rows:
    products: 82                  # 82 variant rows across 33 products (est 100)
    orders: 562900
    customers: 363585             # incl. 68,250 pre-window legacy customers (est 380000)
    order_items: 822251           # 1.46 lines/order — gift and Navidium lines lift it above 1
    crm_events: 1077576           # klaviyo_events.csv, 12 historic + 6 future months (est 700000)
    ga4_events: 400816            # web checkouts only; Skio renewals bypass the pixel
    ga4_event_items: 639732
    subscriptions: 75022          # skio_subscriptions.csv (est 62000)
    subscription_orders: 198568   # skio_subscription_orders.csv (billing attempts)
    ad_performance_google: 7802   # google_ads_campaign_performance.csv
    ad_performance_meta: 11646    # meta_ads_insights.csv, 110 ads on flighted schedules
    ad_creatives_meta: 110        # meta_ad_creatives.csv, one row per ad (est 900)
    ad_performance_tiktok: 10448  # tiktok_ads_insights.csv, 200 ads on short flights
    support_tickets: 14041        # gorgias_tickets.csv, 2.5% of orders
    total: 4194579                # vs 3.69m estimated; still comfortably under the 5m threshold
  threshold_total_raw_rows: 5000000
  protected_dimensions:
    - products
  reduction_actions:
    reduce_historic_window_to_months:
    row_volume_scaling_factor: 1.0
    rationale: >
      The full-scale build projects ~3.69m raw rows, below the 5m threshold, so neither the window cut
      nor operational row scaling is required and both are left off. Products are recorded as a
      protected dimension anyway so that any later decision to scale cannot shrink the catalog. If the
      user prefers a faster build, the fallback is row_volume_scaling_factor 0.5 (~1.85m rows); rates
      (AOV, refund rate, subscription share, retention) are scale-invariant and volume/revenue targets
      would then be compared at target x 0.5.

