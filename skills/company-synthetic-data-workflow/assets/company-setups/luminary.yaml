company:
  name: Luminary Vitamins
  website: https://www.luminaryvitamins.com/
  generated_on: 2026-05-31
  time_window:
    historic_months: 18
    future_months: 6
    override_reason: Using the default 18 historic + 6 future window (no override). Brand was selling by late 2024, so 2024-12 start does not predate launch.
  primary_market: US
  currency: USD
  category: Fertility & prenatal supplements
  subcategory: Doctor-formulated fertility/prenatal gummies (male & female)
  business_model: Subscription-led D2C (replenishment) with one-time purchases
  confidence_note: Catalog and pricing are grounded in the live Shopify storefront (products.json, 2026-05-31). Systems, paid-channel dynamics, and the $10M run-rate target come from the 2026-05-25 Ari (Elo Health) call notes. Commercial scale uses a deliberately conservative read pending direct numbers.

source_time_windows:
  default:
    historic_months: 18
    future_months: 6
  overrides:
    - system_name: Klaviyo
      historic_months: 12
      future_months: 6
      rationale: Trim the email/SMS event stream to the last 12 months to control row volume while preserving the lifecycle story. Anchored to customers and orders.
      anchor_to_tables:
        - customers
        - orders
    - system_name: Google Ads
      historic_months: 0
      future_months: 6
      rationale: Google Ads was blocked historically by keyword restrictions ("sperm") and is assumed unblocked the week of 2026-05-25. Performance data therefore exists only from 2026-05-25 forward — zero historic rows — matching reality.
      anchor_to_tables:
        - orders

volume_plan:
  estimated_raw_rows:
    products: 12
    orders: 86000
    customers: 56000
    order_items: 104000
    crm_events: 150000
    ga4_events: 95000  # web-checkout orders only; subscription renewals bypass the GA4 pixel
    ad_performance: 42000
    support_tickets: 3000
    total: 1585000
  threshold_total_raw_rows: 5000000
  protected_dimensions:
    - products
  reduction_actions:
    reduce_historic_window_to_months:
    row_volume_scaling_factor: 1.0
    rationale: Projected raw build (~1.6M rows) is well under the 5M threshold, so no historic-window cut or operational scaling is applied. The Klaviyo 12-month source window already caps the largest table. Products stay complete as a protected dimension.

research:
