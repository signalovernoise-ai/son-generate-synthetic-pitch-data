        inferred_price: 89.00
        rationale: Amazon listing and older marketing use "Create"/"Thrive" naming; modeled as an adjacent legacy SKU that maps to today's Sperm Support / Men's Wellbeing line.
      - name: Fertility Starter Duo (retired bundle)
        inferred_price: 169.00
        rationale: Plausible early bundle adjacent to the current His & Hers bundle and price architecture.
    price_points:
