      - 178.00
    bundles:
      - His & Hers Fertility Bundle
    subscription: available
    subscription_platform: Loop Subscriptions
    subscription_modeling: Modeled via Shopify selling plans on line items (is_subscription derived in staging) as recurring monthly renewals with tenure-based fertility churn — subscribers reorder until they cancel, driving the retention curve. No separate Loop extract in this phase.
    promotions:
      - offer_name: First-order welcome offer
        offer_type: New-customer discount
        details: Welcome codes visible in site theme (e.g. WELCOME28; ~$5-$15 / ~10-15% off first order). Clinical positioning means no deep discounting of the $89 list price.
        evidence_source: https://www.luminaryvitamins.com/ (homepage theme strings)
