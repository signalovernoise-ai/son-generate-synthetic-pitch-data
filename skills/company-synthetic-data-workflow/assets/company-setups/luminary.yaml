source_systems:
  confirmed:
    - name: Shopify
      confirmation_source: public_evidence
      evidence_links:
        - https://www.luminaryvitamins.com/products.json
      evidence_notes: cdn.shopify/myshopify signatures and a live products.json catalog confirm Shopify.
      domain: commerce
      export_shape: standard connector schema
      platform_resources:
        - products
        - orders
        - customers
        - order_items
      join_keys:
        - product_id
        - variant_id
        - order_id
        - customer_id
      schema_basis: official documentation
      schema_notes: Subscriptions (Loop) are modeled via selling-plan data on line items; is_subscription is derived in staging, not an order-level boolean.
      known_limitations:
        - No separate Loop subscription extract in this phase; subscription state is represented through Shopify selling plans.
    - name: Klaviyo
      confirmation_source: user_confirmed
      evidence_links:
        - Ari (Elo Health) call notes, 2026-05-25
        - https://www.luminaryvitamins.com/
      evidence_notes: User-directed. On-site technology profiler was inconclusive because the brand loads martech through Shopify's web-pixel sandbox (no third-party pixel visible in static HTML). Call notes name Customer.io for email/CRM; the user chose to model Klaviyo. Conflict recorded.
      domain: lifecycle
      export_shape: events_api
      platform_resources:
        - email_events
        - sms_events
      join_keys:
        - email
        - profile_id
      schema_basis: official documentation
      schema_notes: Single event-per-row stream (klaviyo_events.csv); metric_name names the action. Trim to 12 historic months.
      known_limitations:
        - Campaign system is user-stated, not profiler-confirmed (web-pixel sandbox). Customer.io is the contrary call-note signal.
    - name: GA4
      confirmation_source: public_evidence
      evidence_links:
        - https://www.luminaryvitamins.com/
      evidence_notes: gtag / google_tag present in site HTML.
      domain: web_analytics
      export_shape: reporting_api
      platform_resources:
        - purchase_events
        - purchase_items
      join_keys:
        - transactionId
      schema_basis: official documentation
      schema_notes: Use the reporting/Data API schema, not BigQuery export. Paid Search channel appears only from 2026-05-25.
      known_limitations:
        - A realistic unattributed baseline and partial purchase-event coverage are modeled.
    - name: Meta Ads
      confirmation_source: call_note_confirmed
      evidence_links:
        - Ari (Elo Health) call notes, 2026-05-25
      evidence_notes: Notes identify Meta as a primary live paid channel and a "start here" integration priority.
      domain: paid_media
      export_shape: insights_api
      platform_resources:
        - ad_insights
        - ad_creatives
      join_keys:
        - campaign_id
        - adset_id
        - ad_id
      schema_basis: official documentation
      schema_notes: Daily ad-level insights (level=ad, time_increment=1) rolling up to adset/campaign; creatives joined on ad_id. Full window.
      known_limitations:
        - Aggregate performance fact; no join to individual commerce orders.
    - name: Google Ads
      confirmation_source: call_note_confirmed
      evidence_links:
        - Ari (Elo Health) call notes, 2026-05-25
      evidence_notes: Notes describe a Google Ads keyword block ("sperm") being unblocked with L Catterton's help. Assumed live from the week of 2026-05-25.
      domain: paid_media
      export_shape: googleads_api
      platform_resources:
        - campaign_performance
      join_keys:
        - campaign_id
      schema_basis: official documentation
      schema_notes: Daily campaign-level GAQL performance. Future-only window (2026-05-25 -> 2026-11-30); zero historic rows by design.
      known_limitations:
        - No historic data; this is the realistic "newly unblocked" structural feature.
  open_questions:
    - Campaign system: Klaviyo (modeled) vs Customer.io (call notes). Unresolved; confirm with Ari or via Shopify installed-apps.
    - Amazon (Marketing Stream / Seller Central / third API) deferred due to complexity; excluded from this phase.
    - Exact subscribe & save discount and shipping terms are assumptions pending client confirmation.

standardization:
  canonical_tables:
    - users
    - orders
  mapping_notes:
    - No stage or analytics outputs until raw source outputs are generated, validated, and reviewed.
    - Google Ads + Meta clean into the shared ad_performance metric vocabulary for a unified paid-performance view.

data_issues:
  selected:
    - issue: Email casing or whitespace drift
      severity: low
      expected_prevalence: 1-3% of Shopify and Klaviyo email records
      check: email_casing_or_whitespace_drift
      expected_prevalence_range: [0.01, 0.03]
      affected_systems:
        - Shopify
        - Klaviyo
      visibility: subtle
      rationale: Common identity-normalization issue across commerce and email systems.
      notes: Lower/trim normalization reconciles it in staging.
    - issue: Duplicate-looking operational rows
      severity: low
      expected_prevalence: Less than 0.5% of orders
      check: near_duplicate_orders
      expected_prevalence_range: [0.0005, 0.005]
      affected_systems:
        - Shopify
        - Zendesk
      visibility: subtle
      rationale: Light operational mess (duplicate-looking order names; underlying id stays unique) improves realism.
      notes: Keep sparse and platform-appropriate.
    - issue: Guest vs account identity fragmentation
      severity: medium
      expected_prevalence: 1-2% of customers
      affected_systems:
        - Shopify
        - Klaviyo
        - GA4
      visibility: subtle
      rationale: Believable across DTC commerce and email joins (guest checkout vs account, email-only Klaviyo profiles).
      notes: MANUAL. Signature - some Klaviyo profiles and GA4 users require fallback email matching rather than a clean key join.
    - issue: GA4 covers only web-checkout orders (subscription renewals bypass the pixel)
      severity: high
      expected_prevalence: ~46% of orders absent from GA4 — ~90% of subscription renewals plus ~7% web tag/consent loss
      affected_systems:
        - GA4
      visibility: subtle
      rationale: Recurring subscription orders are created server-side (Loop/Shopify subscription contracts) with no web session, so they never fire the GA4 web purchase event. First orders and one-time repeats are real web checkouts (~93% captured). The few renewals that do appear carry Direct/(not set), never a paid channel. This is structural and a key pitch insight - GA4 alone understates retention/LTV and would over-credit paid acquisition if renewals were attributed.
      notes: MANUAL. Signature - GA4 covers ~93% of first/one-time orders but ~10% of renewals; renewal events carry Direct/(not set) only. Count orders missing from ga4_reporting_purchase_events.transactionId split by renewal status.
    - issue: Non-uniform channel mix with unattributed baseline
      severity: low
      expected_prevalence: Baseline ~8-10% unattributed; Paid Search absent before 2026-05-25
      affected_systems:
        - GA4
      visibility: subtle
      rationale: Channel mix should be realistically skewed (Meta/paid social heavy, paid search only post-unblock), not uniform.
      notes: MANUAL. See references/channel-mix-benchmarks.md. Do not stack multiple unattributed code paths.
    - issue: Promo-acquired cohort quality shift
      severity: medium
      expected_prevalence: Concentrated in welcome-offer cohorts
      affected_systems:
        - Shopify
        - GA4
      visibility: hidden_until_standardization
      rationale: Welcome-offer first orders show lower AOV and different repeat behavior than baseline cohorts.
      notes: MANUAL. Useful for the retention/quality narrative.
    - issue: Enum and status drift
      severity: low
      expected_prevalence: Low scattered prevalence across Klaviyo and Zendesk
      affected_systems:
        - Klaviyo
        - Zendesk
      visibility: subtle
      rationale: Realistic export inconsistency (mixed casing/status variants) without overwhelming the data.
      notes: MANUAL. Collapsed by enum_casing_drift in staging only where genuine drift exists.

execution_plan:
  approval_status: approved
  current_phase: source_generation
  scope_summary: Generate raw source-shaped datasets for Luminary Vitamins using a products-first dependency model over an 18 historic + 6 future window, with Klaviyo trimmed to 12 historic months and Google Ads future-only (2026-05-25 onward). No operational scaling required.
  approved_time_window:
    historic_months: 18
    future_months: 6
    override_reason: Default window; no reduction needed (projected ~1.6M rows < 5M threshold).
  catalog_and_promotion_summary: Ground products to the live $89 catalog and $178 bundle; model first-order welcome offers and ~15% subscribe & save with blanket free US shipping; carry promo mechanics into historical and future order behavior.
  metric_assumptions_summary: Conservative scale - current run-rate ~$5.6M (May 2026) growing toward ~$7.8M (Nov 2026), below the $10M target. Subscription share rises from ~22% to ~40%; refunds ~4.0-4.5%.
  volume_summary: Projected ~1.6M raw rows, under the 5M threshold. Klaviyo (largest table) capped by a 12-month source window. Products protected from any scaling.
  generation_sequence:
    - step: generate_products
      depends_on: []
    - step: generate_orders
      depends_on:
        - generate_products
    - step: generate_customers
      depends_on:
        - generate_orders
        - generate_products
    - step: generate_dependent_datasets
      depends_on:
        - generate_products
        - generate_orders
        - generate_customers
  parallel_groups:
    - name: downstream_raw_sources
      members:
        - shopify_order_items
        - ga4
        - klaviyo
        - meta_ads
        - google_ads
        - zendesk
      depends_on:
        - generate_orders
        - generate_customers
        - generate_products
  phase_gates:
    - phase: source_generation
      approval_required_before_next: true
    - phase: stage_standardization
      approval_required_before_next: true
    - phase: analytics_generation
      approval_required_before_next: false
  consistency_checks:
    - foreign_key_reconciliation
    - timestamp_plausibility
    - cross_system_entity_coverage
  validation_tests:
    - name: primary_key_uniqueness
      threshold:
        max_duplicates: 0
    - name: foreign_key_reconciliation
      threshold:
        max_orphans: 0
    - name: ga4_order_timestamp_alignment
      threshold: 30_minutes
    - name: modeling_window_bounds
      threshold:
        historic_months: 18
        future_months: 6
        window_start: 2024-12-01
        window_end: 2026-11-30
    - name: source_specific_window_bounds
      threshold:
        klaviyo_historic_months: 12
        google_ads_historic_months: 0
        earliest_by_file:
          klaviyo_events.csv: 2025-06-01
          meta_ads_insights.csv: 2024-12-01
          google_ads_campaign_performance.csv: 2026-05-25
    - name: promotion_and_discount_consistency
      threshold:
        note: Monthly volume targets are promo-inclusive; validate promo effects on AOV/mix, not on monthly volume. See references/metric-definitions.md.
    - name: metric_trajectory_alignment
      threshold:
        orders_pct: 4
        revenue_pct: 6
        aov_pct: 4
  accepted_waivers: []
  open_questions:
    - Confirm campaign system (Klaviyo vs Customer.io) before stage/analytics delivery.

