    - Ari (Elo Health) call notes, 2026-05-25
  summary: >
    Luminary Vitamins is a US DTC brand of doctor-formulated fertility and prenatal gummy
    supplements on Shopify, spanning the reproductive journey (preconception, pregnancy,
    postpartum, hormonal/PCOS) plus male fertility (sperm support) and general wellbeing.
    Clinical positioning at $89 vs ~$25 mass competitors, a strong ~18% PDP conversion rate,
    and a stated $10M run-rate target. Subscriptions run on Loop; the brand cannot compete on
    Amazon search or discount aggressively. Google Ads is blocked on the "sperm" keyword and is
    being unblocked (L Catterton assist); Meta is the primary live paid channel.
  product_catalog:
    hero_products:
      - Sperm Support Gummies
      - Preconception Gummies
      - Pregnancy Gummies
      - His & Hers Fertility Bundle
    current_products:
      - name: Egg Support Gummies
